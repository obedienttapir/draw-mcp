<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basement Cinema Planner</title>
<meta name="description" content="Interactive 3D planner for a basement home cinema: TV alcove, L-sectional, fireplace lounge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Italiana&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating glass panels pinned to the edges (room/furnish left, inspector right, camera dock bottom). */
:root {
  --stage: #120f0c;          /* behind the canvas */
  --panel: rgba(24, 20, 16, 0.86);
  --panel-solid: #1c1814;
  --line: rgba(232, 214, 190, 0.12);
  --line-strong: rgba(232, 214, 190, 0.24);
  --fg: #efe6d8;
  --muted: #a99c8a;
  --faint: #7a6f61;
  --brass: #d6a463;          /* 2700K LED glow, used for active state + key numbers */
  --brass-dim: rgba(214, 164, 99, 0.16);
  --ok: #8fbf8a;
  --warn: #e2b55a;
  --bad: #e07a62;
  --font-mark: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: var(--stage); color: var(--fg); }
[hidden] { display: none !important; }
body { font-family: var(--font-ui); font-size: 13px; line-height: 1.4; }
#app { position: relative; height: 100%; overflow: hidden; background: var(--stage); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar {
  position: absolute; top: 12px; left: var(--gutter-l); right: var(--gutter-r);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; pointer-events: none; z-index: 5;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 1px; padding: 6px 14px 7px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); min-width: 0; }
.brand .mark { font-family: var(--font-mark); font-size: 21px; letter-spacing: 0.06em; line-height: 1.1; }
.brand .sub { font-family: var(--font-num); font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 3px; gap: 2px; backdrop-filter: blur(10px); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; color: var(--muted);
  font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }
.seg button:hover { color: var(--fg); background: rgba(255,255,255,0.04); }
.seg button[aria-pressed="true"], .seg button.on { background: var(--brass-dim); color: var(--brass); }
.spacer { flex: 1; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 8px 12px;
  color: var(--fg); backdrop-filter: blur(10px); white-space: nowrap; }
.iconbtn:hover { border-color: var(--line-strong); }
.iconbtn:disabled { opacity: 0.4; cursor: default; }
.only-narrow { display: none; }

/* ---------- panels ---------- */
.panel {
  position: absolute; top: 84px; bottom: 76px; width: 300px; z-index: 4;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel.left { left: var(--gutter-l); }
.panel.right { right: var(--gutter-r); width: 288px; }
.panel.collapsed { display: none; }
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { flex: 1; border: 0; background: none; padding: 11px 4px 10px; color: var(--muted); font-weight: 500;
  border-bottom: 2px solid transparent; letter-spacing: 0.02em; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brass); }
.scroll { overflow-y: auto; flex: 1; padding: 6px 14px 16px; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
.group { padding: 12px 0 10px; border-bottom: 1px solid var(--line); display: grid; gap: 9px; }
.group:last-child { border-bottom: 0; }
.group h3 { margin: 0; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); }
.group p.note { margin: 0; color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.row label { color: var(--fg); min-width: 0; }
.row .val { font-family: var(--font-num); font-size: 11.5px; color: var(--brass); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.slider { display: grid; gap: 4px; }
input[type="range"] { width: 100%; accent-color: var(--brass); height: 18px; margin: 0; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.toggle input { appearance: none; width: 34px; height: 20px; border-radius: 20px; background: rgba(255,255,255,0.12);
  position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--fg); transition: transform .2s; }
.toggle input:checked { background: var(--brass); }
.toggle input:checked::after { transform: translateX(14px); background: #1c1612; }
select { width: 100%; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); padding: 0; position: relative; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px var(--brass); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: rgba(255,255,255,0.03); border-radius: 999px; padding: 6px 11px; white-space: nowrap; }
.chip:hover { border-color: var(--brass); }
.chip[aria-pressed="true"] { background: var(--brass-dim); border-color: var(--brass); color: var(--brass); }
.catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.catalog button { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,0.03); border-radius: 9px; padding: 8px 9px; display: grid; gap: 1px; }
.catalog button:hover { border-color: var(--brass); }
.catalog b { font-weight: 500; }
.catalog small { color: var(--muted); font-family: var(--font-num); font-size: 10.5px; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-strong); background: rgba(255,255,255,0.04); border-radius: 8px; padding: 7px 10px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); color: #1c1612; border-color: var(--brass); font-weight: 600; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }

/* ---------- inspector ---------- */
.insp-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; flex: none; }
.insp-head .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); }
.insp-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.insp-head .dims { font-family: var(--font-num); font-size: 11.5px; color: var(--muted); }
.empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
.stat .k { color: var(--muted); }
.stat .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid currentColor; width: fit-content; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
.meter { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.08); position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--brass); border-radius: 6px; }
.meter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .55; }

/* ---------- bottom dock ---------- */
.dock { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 5; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.dock .seg { overflow-x: auto; scrollbar-width: none; flex: none; }
.dock #presets { flex: 0 1 auto; min-width: 0; }
.dock .seg::-webkit-scrollbar { display: none; }
.hint { position: absolute; left: var(--gutter-l); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 3;
  color: var(--faint); font-size: 11.5px; pointer-events: none; }
/* view-only: everything but the 3D view (and the walk pad) steps aside */
#app.focus .topbar, #app.focus .panel, #app.focus #presets, #app.focus .dock .seg[aria-label="Tools"], #app.focus .hint { display: none !important; }
.restore { position: absolute; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px)); right: var(--gutter-r);
  border: 1px solid var(--line-strong); background: rgba(24, 20, 16, 0.72); color: var(--fg); border-radius: 999px; padding: 9px 14px; }
/* fast display: no backdrop blur over the canvas (it is re-blurred on every frame) */
#app.fast .panel, #app.fast .seg, #app.fast .brand, #app.fast .iconbtn { backdrop-filter: none; background: var(--panel-solid); }
.toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); z-index: 9; background: var(--panel-solid);
  border: 1px solid var(--brass); color: var(--fg); padding: 8px 14px; border-radius: 999px; font-size: 12.5px;
  opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

/* ---------- 2D labels ---------- */
.dim { font-family: var(--font-num); font-size: 11px; color: var(--fg); background: rgba(18,15,12,0.78); border: 1px solid var(--line-strong);
  padding: 1px 6px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dim.brass { color: #1c1612; background: var(--brass); border-color: var(--brass); }
.dim.spk { color: #10202b; background: #7fb3d5; border-color: #7fb3d5; font-weight: 500; }
.tag { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  background: rgba(18,15,12,0.6); padding: 1px 6px; border-radius: 4px; }

/* ---------- modal ---------- */
.modal { position: absolute; inset: 0; z-index: 20; background: rgba(8,6,5,0.6); display: grid; place-items: center;
  padding: 16px var(--gutter-r) 16px var(--gutter-l); }
.modal .card { background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 14px; width: min(560px, 100%);
  padding: 18px; display: grid; gap: 12px; max-height: 100%; overflow: auto; }
.modal h2 { margin: 0; font-size: 16px; }
.modal p { margin: 0; color: var(--muted); }
.modal textarea { width: 100%; min-height: 180px; background: #0f0d0b; border: 1px solid var(--line-strong); border-radius: 8px;
  font-family: var(--font-num); font-size: 11px; padding: 10px; resize: vertical; box-sizing: border-box; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-num);
  z-index: 30; background: var(--stage); transition: opacity .4s; }
.loading.done { opacity: 0; pointer-events: none; }

/* ---------- narrow screens ---------- */
@media (max-width: 1499px) { .hint { display: none; } }
@media (max-width: 900px) {
  .panel { top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); height: min(52%, 430px); width: auto;
    left: var(--gutter-l) !important; right: var(--gutter-r) !important; }
  .panel.right { width: auto; }
  .only-narrow { display: inline-flex; }
  .hint { display: none; }
  .dock { left: var(--gutter-l); right: var(--gutter-r); transform: none; max-width: none; justify-content: center; }
  .brand .sub { display: none; }
  .brand .mark { font-size: 18px; }
}
@media (max-width: 520px) {
  .topbar { gap: 8px; }
  .seg button { padding: 7px 9px; }
  .wide-only { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div class="loading" id="loading">Loading 3D room…</div>

  <header class="topbar">
    <div class="brand">
      <span class="mark">Basement Cinema</span>
      <span class="sub" id="roomSub">Room 1 · 228″ × 185″ · 9′ ceiling</span>
    </div>
    <div class="seg" role="group" aria-label="View mode">
      <button id="mode-orbit" aria-pressed="true" title="Orbit around the room (1)">3D</button>
      <button id="mode-plan" aria-pressed="false" title="Top-down plan with dimensions (2)">Plan</button>
      <button id="mode-walk" aria-pressed="false" title="Walk at eye height: WASD + drag (3)">Walk</button>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="toggleLeft" aria-expanded="true" aria-controls="leftPanel" title="Show or hide the design panel">Design</button>
    <button class="iconbtn" id="toggleRight" aria-expanded="true" aria-controls="rightPanel" title="Show or hide the details panel">Details</button>
    <button class="iconbtn" id="undoBtn" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button class="iconbtn" id="focusBtn" title="Hide the menus and see only the 3D view (H)">Hide menus</button>
    <button class="iconbtn wide-only" id="codeBtn" title="Copy or paste a layout">Layout code</button>
  </header>

  <aside class="panel left" id="leftPanel" aria-label="Design panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="furnish" aria-selected="true">Furnish</button>
      <button role="tab" data-tab="light" aria-selected="false">Lighting</button>
      <button role="tab" data-tab="finish" aria-selected="false">Finishes</button>
      <button role="tab" data-tab="room" aria-selected="false">Room</button>
    </nav>
    <div class="scroll" id="tab-furnish" role="tabpanel"></div>
    <div class="scroll" id="tab-light" role="tabpanel" hidden></div>
    <div class="scroll" id="tab-finish" role="tabpanel" hidden></div>
    <div class="scroll" id="tab-room" role="tabpanel" hidden></div>
  </aside>

  <aside class="panel right" id="rightPanel" aria-label="Details panel">
    <div class="insp-head" id="inspHead"></div>
    <div class="scroll" id="inspBody"></div>
  </aside>

  <div class="dock">
    <div class="seg" role="group" aria-label="Camera presets" id="presets">
      <button data-preset="overview">Overview</button>
      <button data-preset="sofa">From sofa</button>
      <button data-preset="tvwall">TV wall</button>
      <button data-preset="lounge">Fireplace</button>
      <button data-preset="stairs">From stairs</button>
    </div>
    <div class="seg" role="group" aria-label="Walk" id="walkpad" hidden>
      <button data-walk="1" title="Hold to walk forward">▲ Walk</button>
      <button data-walk="-1" title="Hold to step back">▼</button>
    </div>
    <div class="seg" role="group" aria-label="Tools">
      <button id="measureBtn" aria-pressed="false" title="Tape measure: click two points (M)">Measure</button>
    </div>
  </div>
  <div class="hint" id="hint">Click furniture to select · drag to move · Q / E rotate · Del removes</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <button class="restore" id="restoreBtn" hidden title="Show the menus again (H)">Show menus</button>

  <div class="modal" id="codeModal" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
      <h2 id="codeTitle">Layout code</h2>
      <p>Copy this to keep a version of the design, or paste a code you saved earlier and apply it. Your latest layout is also kept in this browser.</p>
      <textarea id="codeText" spellcheck="false" aria-label="Layout code"></textarea>
      <div class="btnrow">
        <button class="btn primary" id="codeCopy">Copy</button>
        <button class="btn" id="codeApply">Apply pasted code</button>
        <span class="spacer"></span>
        <button class="btn danger" id="codeReset">Reset to starting layout</button>
        <button class="btn" id="codeClose">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
// ---- 00-core.js ----
// ===================================================================
// 00 · Core: imports, units, default design state, helpers
// World units are INCHES. Plan coords: x = east (0 = fireplace wall),
// y = north (0 = staircase wall). three.js: X = x, Y = up, Z = -y.
// ===================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DEG = Math.PI / 180;
const LUX = 1550;            // candela scale: physical lights tuned in metres, world is in inches
const STORE_KEY = 'basement-cinema-layout-v1';
const QUALITY_KEY = 'basement-cinema-quality';

// Display quality is a per-device preference (not part of a layout). Fast is the default:
// 1x pixel ratio with adaptive scaling, no glow pass, no area lights, a few zone lights.
let quality = (() => { try { return localStorage.getItem(QUALITY_KEY) === 'high' ? 'high' : 'fast'; } catch (e) { return 'fast'; } })();
const isFast = () => quality !== 'high';
let dprScale = 1;                       // adaptive resolution factor in fast mode
// Render on demand: frames are drawn only while something changes or animates.
let dirty = 3;
function invalidate(n = 2) { dirty = Math.max(dirty, n); }

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (x, y, z = 0) => new THREE.Vector3(x, z, -y);   // plan (x, y) + height z -> world

/** 185 -> 15′-5″ ; halves shown as ½ */
function ftin(v) {
  const neg = v < 0; v = Math.abs(v);
  let inches = Math.round(v * 2) / 2;
  let ft = Math.floor(inches / 12);
  let rem = inches - ft * 12;
  if (rem >= 12) { ft += 1; rem -= 12; }
  const whole = Math.floor(rem), half = rem - whole >= 0.5 ? '½' : '';
  return `${neg ? '-' : ''}${ft}′-${whole}${half}″`;
}
const inch = (v) => `${Math.round(v * 2) / 2}″`;
const tvDims = (diag) => ({ w: diag * 16 / Math.hypot(16, 9), h: diag * 9 / Math.hypot(16, 9) });

let _uid = 1;
const uid = (p = 'it') => `${p}${Date.now().toString(36)}${(_uid++).toString(36)}`;

// -------------------------------------------------------------------
// Default design. Room numbers come from the owner's tape (228″ wall to
// wall, 185″ stairs → TV wall, 9′ ceiling); bay geometry from the
// foundation plan (2′-7″ / 7′-9″ / 2′-7″ bay, 2′-2″ jog, steel beam W200).
// -------------------------------------------------------------------
const DEFAULT_STATE = {
  room: {
    width: 228,            // fireplace wall -> exterior wall
    depth: 185,            // staircase wall -> TV wall (back of bay)
    ceiling: 108,          // 9'
    bayDepth: 60,          // main north wall line -> TV wall
    bayLeft: 73,           // x of bay's west return: alcove measures 10'-9" across
    bayRight: 202,         // x of bay's east return (2'-2" jog to exterior wall)
    bayFace: 84,           // flat TV wall inside the bay
    soffitDepth: 12,       // bay bulkhead projection from the bay walls
    soffitBottom: 92,      // bay bulkhead underside
    beamX: 33,             // steel beam centre line (W200) from fireplace wall
    beamDepth: 73,         // fireplace-side bulkhead: runs out to the line of the TV alcove's west return
    beamBottom: 94,        // bulkhead underside over fireplace lounge
    pilasterW: 18, pilasterD: 10,
    boxX: 45,              // wall the stairs face: fireplace alcove is 3'-9" deep from its corner
    stairWidth: 40, stairStart: 92, risers: 16, floorToFloor: 122,   // 3'-11" landing, tip 11'-6" from the exterior wall
    hallDepth: 54, hallEnd: 176,   // open hallway behind the stairs (two doors), railing along that side
    transomW: 42, transomH: 10, transomBottom: 80, transomGap: 6,
  },
  finish: {
    wall: '#cbc2b3', floor: 'walnut', slat: 'walnut',
    fireplaceSlats: true, tvSlats: false, bayAccent: 'paint-dark',
    fabric: '#8f877c', boucle: '#e6dccb',
    transoms: 'windows',   // windows | slatted | hidden | framed | band | shade  (the two openings are already cut)
    mantel: 'none',        // none | ledge | bench | picture | slab | shelves
  },
  tv: { size: 75, center: 44, offset: 0, screen: false, screenSize: 110 },
  fireplace: { width: 52, height: 22, bottom: 30, center: 60 },
  light: { scene: 'evening', pots: 0.35, leds: 1, tv: false, fire: true, lamp: true, bloom: true,
    bayPots: true, bias: false, steps: false, screenDown: false },
  rev: 2,                 // room-measurement revision; older saved layouts get the corrected room
  option: 'original',

/** Everything the scene needs that is derived from the editable room numbers. */
function geom(r = state.room) {
  const mainY = r.depth - r.bayDepth;
  const a = Math.max(0, (r.bayRight - r.bayLeft - r.bayFace) / 2);
  const ret = Math.max(0, r.bayDepth - a);
  const bay = [
    [r.bayLeft, mainY], [r.bayLeft, mainY + ret], [r.bayLeft + a, r.depth],
    [r.bayRight - a, r.depth], [r.bayRight, mainY + ret], [r.bayRight, mainY],
  ];
  const tvX = (bay[2][0] + bay[3][0]) / 2;
  // floor outline, counter-clockwise (interior on the left of each edge)
  // the landing and the open hallway behind the stairs are part of the floor
  const hallY = -r.stairWidth - r.hallDepth, hallEnd = clamp(r.hallEnd, r.boxX + 24, r.width - 1);
  const outline = [
    [0, 0], [r.boxX, 0], [r.boxX, hallY], [hallEnd, hallY], [hallEnd, -r.stairWidth], [r.width, -r.stairWidth],
    [r.width, mainY], [r.bayRight, mainY], bay[4], bay[3], bay[2], bay[1], bay[0], [0, mainY],
  ];
  const riserH = r.floorToFloor / r.risers;
  const treads = r.risers - 1;
  const run = Math.min((r.width - r.stairStart) / treads, 11);
  return { mainY, a, ret, bay, tvX, outline, riserH, treads, run, hallY, hallEnd };
}

const history = [];
function snapshot() { return JSON.stringify({ ...state, light: { ...state.light } }); }
function pushHistory() {
  history.push(snapshot());
  if (history.length > 60) history.shift();
  const b = $('#undoBtn'); if (b) b.disabled = history.length === 0;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    return applyState(JSON.parse(raw), false);
  } catch (e) { return false; }
}
/** Merge a (possibly partial / older) layout object onto the defaults. */
function applyState(obj, record = true) {
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.items)) return false;
  if (record) pushHistory();
  const d = clone(DEFAULT_STATE);
  const stale = (obj.rev || 1) < d.rev;
  if (stale) setTimeout(() => toast('Room updated to the new measurements; your furniture and finishes were kept'), 600);
  state = {
    ...d, ...obj, rev: d.rev,
    room: stale ? d.room : { ...d.room, ...(obj.room || {}) },
    finish: { ...d.finish, ...(obj.finish || {}) },
    tv: { ...d.tv, ...(obj.tv || {}) },
    fireplace: { ...d.fireplace, ...(obj.fireplace || {}) },
    light: { ...d.light, ...(obj.light || {}) },
    items: obj.items.filter((it) => it && it.type).map((it) => ({ id: it.id || uid(), rot: 0, p: {}, ...it })),
  };
  return true;
}

function rng(seed) {                       // mulberry32
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, f) {                   // f > 0 lighten, f < 0 darken
  const c = new THREE.Color(hex);
  return f >= 0 ? c.lerp(new THREE.Color('#ffffff'), f) : c.lerp(new THREE.Color('#000000'), -f);
}
const css = (c) => '#' + c.getHexString();
function canvasTex(cv, srgb = true, rep = [1, 1]) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 8;
  return t;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/** Wood: planks (floor) or one long board face (slats). Grain runs along canvas Y. */
function woodCanvas({ base, grain, plankCols = 0, plankRows = 0, seed = 7, size = 1024 }) {
  const cv = mkCanvas(size, size), g = cv.getContext('2d'), r = rng(seed);
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  const cols = Math.max(1, plankCols), colW = size / cols;
  for (let c = 0; c < cols; c++) {
    const rows = plankRows || 1;
    const offset = r() * size;
    for (let k = 0; k <= rows; k++) {
      const y0 = (k * size / rows + offset) % size - (k === 0 ? 0 : 0);
      const h = size / rows;
      const tint = (r() - 0.5) * 0.22;
      g.fillStyle = css(shade(base, tint));
      for (const yy of [y0, y0 - size]) g.fillRect(c * colW, yy, colW, h);
      if (plankRows) {                  // butt joint
        g.fillStyle = 'rgba(0,0,0,0.35)';
        for (const yy of [y0, y0 - size]) g.fillRect(c * colW, yy, colW, 2);
      }
    }
    // grain lines
    g.save(); g.beginPath(); g.rect(c * colW, 0, colW, size); g.clip();
    const lines = 26 + Math.floor(r() * 14);
    for (let i = 0; i < lines; i++) {
      const x = c * colW + r() * colW, amp = 1 + r() * 5, freq = 0.004 + r() * 0.01, ph = r() * 6;
      g.strokeStyle = r() < 0.6 ? grain : css(shade(grain, 0.25));
      g.globalAlpha = 0.12 + r() * 0.28; g.lineWidth = 0.6 + r() * 1.8;
      g.beginPath();
      for (let y = 0; y <= size; y += 16) g.lineTo(x + Math.sin(y * freq + ph) * amp, y);
      g.stroke();
    }
    // a few cathedral arches
    for (let i = 0; i < 3; i++) {
      const cx = c * colW + colW * (0.3 + r() * 0.4), cy = r() * size;
      g.strokeStyle = grain; g.globalAlpha = 0.18; g.lineWidth = 1.2;
      for (let k = 0; k < 6; k++) {
        g.beginPath(); g.ellipse(cx, cy, 4 + k * 5, 40 + k * 28, 0, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
      }
    }
    g.restore(); g.globalAlpha = 1;
    if (plankCols) { g.fillStyle = 'rgba(0,0,0,0.4)'; g.fillRect(c * colW, 0, 2, size); }
  }
  return cv;
}

function noiseCanvas(size, { base = '#808080', amp = 40, blobs = 0, seed = 3, dots = 0 } = {}) {
  const cv = mkCanvas(size, size), g = cv.getContext('2d'), r = rng(seed);
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  const img = g.getImageData(0, 0, size, size), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * amp;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < dots; i++) {           // boucle loops
    const x = r() * size, y = r() * size, rr = 1 + r() * 2.6;
    g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.22)';
    g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
  }
  return cv;
}

function rugCanvas(color, pattern, seed = 11) {
  const size = 512, cv = noiseCanvas(size, { base: color, amp: 26, seed }), g = cv.getContext('2d');
  const r = rng(seed + 1), light = css(shade(color, 0.22)), dark = css(shade(color, -0.25));
  if (pattern === 'border') {
    g.strokeStyle = light; g.lineWidth = 10; g.strokeRect(30, 30, size - 60, size - 60);
    g.strokeStyle = dark; g.lineWidth = 3; g.strokeRect(52, 52, size - 104, size - 104);
  } else {
    g.globalAlpha = 0.14;
    for (let y = 0; y < size; y += 4) { g.fillStyle = y % 8 ? dark : light; g.fillRect(0, y, size, 2); }
    g.globalAlpha = 0.1;
    for (let i = 0; i < 40; i++) {
      g.fillStyle = r() < 0.5 ? light : dark;
      g.fillRect(r() * size, r() * size, 40 + r() * 120, 3 + r() * 10);
    }
    g.globalAlpha = 1;
  }
  return cv;
}

/** Dark porcelain slab with soft white veining. */
function stoneCanvas() {
  const size = 512, cv = noiseCanvas(size, { base: '#2c2926', amp: 14, seed: 61 }), g = cv.getContext('2d'), r = rng(62);
  for (let i = 0; i < 16; i++) {
    g.strokeStyle = `rgba(232,226,214,${0.08 + r() * 0.22})`; g.lineWidth = 0.6 + r() * 2.4;
    g.beginPath(); let x = -20, y = r() * size; g.moveTo(x, y);
    while (x < size + 20) { const nx = x + 40 + r() * 70, ny = y + (r() - 0.45) * 60; g.quadraticCurveTo((x + nx) / 2 + (r() - 0.5) * 40, (y + ny) / 2 + (r() - 0.5) * 40, nx, ny); x = nx; y = ny; }
    g.stroke();
  }
  return cv;
}

function reededCanvas() {
  const cv = mkCanvas(256, 64), g = cv.getContext('2d');
  for (let x = 0; x < 256; x += 8) {
    const grd = g.createLinearGradient(x, 0, x + 8, 0);
    grd.addColorStop(0, '#5f7383'); grd.addColorStop(0.45, '#c9d6de'); grd.addColorStop(1, '#3d4a55');
    g.fillStyle = grd; g.fillRect(x, 0, 8, 64);
  }
  return cv;
}

function radialCanvas(inner = 'rgba(0,0,0,0.55)', outer = 'rgba(0,0,0,0)') {
  const cv = mkCanvas(128, 128), g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  grd.addColorStop(0, inner); grd.addColorStop(0.55, inner.replace(/[\d.]+\)$/, '0.32)')); grd.addColorStop(1, outer);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return cv;
}

function disposeGroup(g) {

/** Inward-facing wall quad from plan p -> q (interior on the left), z0..z1 high. */
function wallQuad(p, q, z0, z1, mat) {
  const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
  const geo = new THREE.PlaneGeometry(len, z1 - z0);
  const m = new THREE.Mesh(geo, mat);
  // plane faces +Z by default; turn it so its normal is the edge's left (interior) side
  m.rotation.y = Math.atan2(dy, dx) + Math.PI;
  m.position.copy(P((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (z0 + z1) / 2));
  m.userData.wall = { p, q };
  return m;
}
/** Dark cap strip on top of a wall, extending outward by WALL_T. */
function wallCap(p, q, z) {
  const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
  const ox = dy / len, oy = -dx / len;                       // outward unit normal
  const shape = new THREE.Shape();
  const e = WALL_T;
  // extend along the edge by e at both ends so corners close
  const ux = dx / len, uy = dy / len;
  const a = [p[0] - ux * e, p[1] - uy * e], b = [q[0] + ux * e, q[1] + uy * e];
  shape.moveTo(a[0], a[1]); shape.lineTo(b[0], b[1]);
  shape.lineTo(b[0] + ox * e, b[1] + oy * e); shape.lineTo(a[0] + ox * e, a[1] + oy * e);
  const geo = new THREE.ShapeGeometry(shape); geo.rotateX(-Math.PI / 2); geo.translate(0, z, 0);
  return new THREE.Mesh(geo, CAP_MAT);
}

/** Offset an open polyline by d to its left (miter joins). */
function offsetPolyline(pts, d) {
  const lines = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const len = Math.hypot(x1 - x0, y1 - y0), nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
    lines.push([[x0 + nx * d, y0 + ny * d], [x1 + nx * d, y1 + ny * d]]);
  }
  const out = [lines[0][0]];
  for (let i = 0; i < lines.length - 1; i++) out.push(intersect(lines[i], lines[i + 1]) || lines[i][1]);
  out.push(lines[lines.length - 1][1]);
  return out;
}
function intersect([a, b], [c, d]) {
  const r = [b[0] - a[0], b[1] - a[1]], s = [d[0] - c[0], d[1] - c[1]];
  const den = r[0] * s[1] - r[1] * s[0];
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c[0] - a[0]) * s[1] - (c[1] - a[1]) * s[0]) / den;
  return [a[0] + r[0] * t, a[1] + r[1] * t];
}

function shapeFrom(pts, holes = []) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
  return s;
}
const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];

/** Openings in the fireplace wall, in wall coords (u = plan y, v = height). */
function fireplaceOpenings() {
  const r = state.room, f = state.fireplace;
  const fp = { u0: f.center - f.width / 2, u1: f.center + f.width / 2, v0: f.bottom, v1: f.bottom + f.height };
  // the two openings are already cut on site; treatments dress them, never move them
  const tr = [], v0 = r.transomBottom, v1 = r.transomBottom + r.transomH, half = r.transomGap / 2;
  for (const s of [-1, 1]) {
    const uA = f.center + s * half, uB = f.center + s * (half + r.transomW);
    tr.push({ u0: Math.min(uA, uB), u1: Math.max(uA, uB), v0, v1 });
  }
  return { fp, tr };
}

function buildRoom() {
  disposeGroup(roomGroup);
  FX.bulkheads = [];
  const r = state.room, G = geom();
  const H = r.ceiling;

  // ---- floor (UVs = plan inches, so plank scale is real) ----
  const floorGeo = new THREE.ShapeGeometry(shapeFrom(G.outline));
  floorGeo.rotateX(-Math.PI / 2);
  const floor = new THREE.Mesh(floorGeo, M.floor);
  floor.name = 'floor'; floor.userData.floor = true;
  roomGroup.add(floor); FX.floor = floor;

  // ---- walls ----
  const o = G.outline, stairOpenX = r.stairStart + 30;
  const stairwell = new THREE.Group(); stairwell.name = 'stairwell'; roomGroup.add(stairwell); FX.stairwell = stairwell;
  for (let i = 0; i < o.length; i++) {
    const p = o[i], q = o[(i + 1) % o.length];
    const isFireplaceWall = p[0] === 0 && q[0] === 0;
    if (isFireplaceWall) continue;                       // built with openings below
    const inBay = G.bay.some((b) => b[0] === p[0] && b[1] === p[1]) && G.bay.some((b) => b[0] === q[0] && b[1] === q[1]);
    const mat = inBay && state.finish.bayAccent !== 'paint-wall' ? M.accent : M.wall;
    const segs = [[p, q]];
    // walls bordering the stairwell rise into it
    const onStairSide = Math.abs(p[1] + r.stairWidth) < 0.01 && Math.abs(q[1] + r.stairWidth) < 0.01;
    if (onStairSide && stairOpenX > Math.min(p[0], q[0]) && stairOpenX < Math.max(p[0], q[0])) segs.splice(0, 1, [p, [stairOpenX, p[1]]], [[stairOpenX, p[1]], q]);
    if (p[0] === r.width && q[0] === r.width) segs.splice(0, 1, [p, [r.width, 0]], [[r.width, 0], q]);
    const inStrip = (pt) => pt[1] <= 0.01 && pt[1] >= -r.stairWidth - 0.01;
    for (const [a, b] of segs) {
      const quad = wallQuad(a, b, 0, H, mat);
      if (inBay) quad.userData.bay = true;
      roomGroup.add(quad);
      if (inStrip(a) && inStrip(b) && Math.min(a[0], b[0]) >= stairOpenX - 0.01) stairwell.add(wallQuad(a, b, H, H + 110, M.wall));
    }
    roomGroup.add(wallCap(p, q, H + 0.2));
  }

  // ---- fireplace wall with fireplace + two transom openings ----
  const { fp, tr } = fireplaceOpenings();
  const holes = [rect(fp.u0, fp.v0, fp.u1, fp.v1), ...tr.map((t) => rect(t.u0, t.v0, t.u1, t.v1))];
  const fwGeo = new THREE.ShapeGeometry(shapeFrom(rect(0, 0, G.mainY, H), holes));
  const fw = new THREE.Mesh(fwGeo, M.wall);
  // shape u (plan y) -> world -Z, v -> world Y, normal (+Z) -> world +X (into the room)
  fw.rotation.y = Math.PI / 2;
  roomGroup.add(fw);
  roomGroup.add(wallCap([0, G.mainY], [0, 0], H + 0.2));
  // reveals (jambs) through the wall thickness
  for (const h of [fp, ...tr]) addReveal(h, M.wall);

  // ---- ceiling with the stairwell opening ----
  const ceilGeo = new THREE.ShapeGeometry(shapeFrom(G.outline, [rect(stairOpenX, -r.stairWidth + 0.01, r.width - 0.01, -0.01)]));
  ceilGeo.rotateX(-Math.PI / 2);
  const ceilMat = M.ceiling.clone(); ceilMat.side = THREE.BackSide;   // invisible from above
  const ceil = new THREE.Mesh(ceilGeo, ceilMat); ceil.position.y = H; ceil.name = 'ceiling';
  roomGroup.add(ceil); FX.ceiling = ceil;
  // stairwell above the opening: header, west side and a lid (inward faces only)
  const top = H + 110;
  stairwell.add(wallQuad([r.width, 0], [stairOpenX, 0], H, top, M.wall));
  stairwell.add(wallQuad([stairOpenX, 0], [stairOpenX, -r.stairWidth], H, top, M.wall));
  // where the hallway is open below, the stairwell still has its south wall above the ceiling
  if (G.hallEnd > stairOpenX) stairwell.add(wallQuad([stairOpenX, -r.stairWidth], [Math.min(G.hallEnd, r.width), -r.stairWidth], H, top, M.wall));
  const lid = new THREE.Mesh(new THREE.PlaneGeometry(r.width - stairOpenX, r.stairWidth), M.ceiling);
  lid.rotation.x = Math.PI / 2; lid.position.copy(P((stairOpenX + r.width) / 2, -r.stairWidth / 2, top));
  stairwell.add(lid);

  // ---- bay bulkhead (soffit following the bay outline) ----
  const outer = G.bay.slice();                                   // L0 .. R0, interior on the right
  const rev = outer.slice().reverse();                           // R0 .. L0, interior on the left
  const inner = offsetPolyline(rev, r.soffitDepth);
  const soffitShape = shapeFrom([...rev, ...inner.slice().reverse()]);
  const sh = H - r.soffitBottom;
  if (sh > 0.5) {
    const sGeo = new THREE.ExtrudeGeometry(soffitShape, { depth: sh, bevelEnabled: false });
    sGeo.rotateX(-Math.PI / 2); sGeo.translate(0, r.soffitBottom, 0);
    const soffit = new THREE.Mesh(sGeo, M.bulkhead); soffit.name = 'bay bulkhead';
    roomGroup.add(soffit); FX.bulkheads.push(soffit);
    FX.soffitInner = inner;                                       // R0' .. L0' (for LED cove + pots)
  } else FX.soffitInner = rev;

  // ---- fireplace-side bulkhead over the steel beam ----
  const bh = H - r.beamBottom;
  if (bh > 0.5 && r.beamDepth > 1) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(r.beamDepth, bh, G.mainY), M.bulkhead);
    b.position.copy(P(r.beamDepth / 2, G.mainY / 2, r.beamBottom + bh / 2)); b.name = 'beam bulkhead';
    roomGroup.add(b); FX.bulkheads.push(b);
    // it carries on over the landing and the hallway, out to the same line
    if (r.beamDepth > r.boxX + 1) {
      const w = r.beamDepth - r.boxX, d = -G.hallY;
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(w, bh, d), M.bulkhead);
      b2.position.copy(P(r.boxX + w / 2, G.hallY / 2, r.beamBottom + bh / 2)); b2.name = 'beam bulkhead (landing)';
      roomGroup.add(b2); FX.bulkheads.push(b2);
    }
  }
  // two doors on the hallway's far wall, as on site
  const hallLen = G.hallEnd - r.boxX;
  const doors = hallLen >= 120 ? [r.boxX + hallLen * 0.27, r.boxX + hallLen * 0.67] : hallLen >= 40 ? [r.boxX + hallLen / 2] : [];
  for (const x of doors) roomGroup.add(makeDoor(x, G.hallY));
  // ---- pilaster under the beam bearing (the rectangular protrusion) ----
  const pil = new THREE.Mesh(new THREE.BoxGeometry(r.pilasterW, r.beamBottom, r.pilasterD), M.wall);
  pil.position.copy(P(r.beamX, G.mainY - r.pilasterD / 2, r.beamBottom / 2)); pil.name = 'pilaster';
  roomGroup.add(pil);
  const pilCap = new THREE.Mesh(new THREE.PlaneGeometry(r.pilasterW, r.pilasterD), CAP_MAT);
  pilCap.rotation.x = -Math.PI / 2; pilCap.position.copy(P(r.beamX, G.mainY - r.pilasterD / 2, H + 0.25));
  roomGroup.add(pilCap);
}

/** Jamb/head/sill faces lining an opening in the fireplace wall (thickness WALL_T, toward -X). */
function addReveal(h, mat) {
  const T = WALL_T, w = h.u1 - h.u0, ht = h.v1 - h.v0, uc = (h.u0 + h.u1) / 2, vc = (h.v0 + h.v1) / 2;
  const head = new THREE.Mesh(new THREE.PlaneGeometry(T, w), mat);
  head.rotation.x = Math.PI / 2; head.position.copy(P(-T / 2, uc, h.v1));          // faces down
  const sill = new THREE.Mesh(new THREE.PlaneGeometry(T, w), mat);
  sill.rotation.x = -Math.PI / 2; sill.position.copy(P(-T / 2, uc, h.v0));         // faces up
  const south = new THREE.Mesh(new THREE.PlaneGeometry(T, ht), mat);
  south.rotation.y = Math.PI; south.position.copy(P(-T / 2, h.u0, vc));            // faces north
  const north = new THREE.Mesh(new THREE.PlaneGeometry(T, ht), mat);
  north.position.copy(P(-T / 2, h.u1, vc));                                        // faces south
  roomGroup.add(head, sill, south, north);
}

/** White two-panel door with casing on a wall facing north (into the hallway). */
function makeDoor(x, y) {
  const g = new THREE.Group(), w = 30, h = 80;
  const white = cached('door-white', () => new THREE.MeshStandardMaterial({ color: '#f1eee8', roughness: 0.55 }));
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.4), white); slab.position.set(0, h / 2, 0.7); g.add(slab);
  for (const py of [h * 0.72, h * 0.3]) {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(w - 9, h * 0.36, 0.3), white); panel.position.set(0, py, 1.5); g.add(panel);
  }
  for (const [sx, sy, px, py] of [[2.6, h + 2.6, -w / 2 - 1.3, (h + 2.6) / 2], [2.6, h + 2.6, w / 2 + 1.3, (h + 2.6) / 2], [w + 5.2, 2.6, 0, h + 1.3]]) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, 0.8), white); c.position.set(px, py, 0.4); g.add(c);
  }
  const knob = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 8), M.metal); knob.position.set(w / 2 - 3, 36, 2.2); g.add(knob);
  g.rotation.y = Math.PI;                       // face north (world -Z)
  g.position.copy(P(x, y + 0.05, 0));
  return g;
}

// ===================================================================
// 25 · Fixtures: stairs, slat walls, fireplace (animated), transoms, TV
// ===================================================================
const SLAT_W = 1.1, SLAT_GAP = 0.55, SLAT_D = 0.75, FELT_D = 0.45;
const SLAT_FACE = SLAT_D + FELT_D;          // how far a slat wall stands off the drywall

/**
 * Slat panel in a local wall frame: u along the wall, v up, +Z into the room.
 * holes: [{u0,u1,v0,v1}] that slats stop around.
 */
function buildSlats(u0, u1, v0, v1, holes, feltHoles = holes) {
  const g = new THREE.Group();
  const pitch = SLAT_W + SLAT_GAP, n = Math.floor((u1 - u0 + SLAT_GAP) / pitch);
  const start = u0 + ((u1 - u0) - (n * pitch - SLAT_GAP)) / 2;
  const segs = [];
  for (let i = 0; i < n; i++) {
    const a = start + i * pitch, b = a + SLAT_W;
    let cuts = [[v0, v1]];
    for (const h of holes) {
      if (b <= h.u0 || a >= h.u1) continue;
      cuts = cuts.flatMap(([s, e]) => {
        if (e <= h.v0 || s >= h.v1) return [[s, e]];
        const out = [];
        if (h.v0 > s) out.push([s, h.v0]);
        if (h.v1 < e) out.push([h.v1, e]);
        return out;
      });
    }
    for (const [s, e] of cuts) if (e - s > 0.5) segs.push([a + SLAT_W / 2, (s + e) / 2, e - s]);
  }
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.slat, segs.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  segs.forEach(([u, v, h], i) => {
    p.set(u, v, FELT_D + SLAT_D / 2); s.set(SLAT_W, h, SLAT_D);
    inst.setMatrixAt(i, m4.compose(p, q, s));
  });
  inst.userData.slats = true;
  g.add(inst);
  // black acoustic felt behind; it can stay open where slats run across a window
  const felt = new THREE.Mesh(new THREE.ShapeGeometry(shapeFrom(rect(u0, v0, u1, v1),
    feltHoles.map((h) => rect(h.u0, h.v0, h.u1, h.v1)))), M.felt);
  felt.position.z = FELT_D;
  g.add(felt);
  return g;
}

// ---------------- flames ----------------
// uDirect: 1 when drawing straight to the 8-bit canvas (Fast, or High without glow), 0 into the HDR glow target
const flameUniforms = { uTime: { value: 0 }, uIntensity: { value: 1 }, uDirect: { value: 1 } };
function flameMaterial(seed) {
  return new THREE.ShaderMaterial({
    uniforms: { ...flameUniforms, uSeed: { value: seed } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      uniform float uTime; uniform float uIntensity; uniform float uSeed; uniform float uDirect; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
      void main(){
        vec2 uv = vUv;
        // flame height wanders along the burner; turbulence bends it, so no regular 'teeth'
        // (smoothstep edges always ascending: reversed edges are undefined in GLSL and render grey on some GPUs)
        float n1 = noise(vec2(uv.x*5.0 + uSeed, uTime*0.8));
        float n2 = noise(vec2(uv.x*13.0 - uSeed, uTime*1.6));
        float h = 0.22 + 0.5*n1 + 0.22*n2;
        float turb = noise(vec2(uv.x*9.0 + uSeed, uv.y*3.5 - uTime*2.4)) - 0.5;
        float y = uv.y + turb * 0.22 * uv.y;
        float f = (1.0 - smoothstep(h * 0.3, h + 0.08, y)) * smoothstep(0.0, 0.07, uv.y);
        f *= smoothstep(0.0, 0.05, uv.x) * (1.0 - smoothstep(0.95, 1.0, uv.x));
        float core = 1.0 - smoothstep(0.0, 0.55, uv.y / max(h, 0.02));
        vec3 col = mix(vec3(1.0, 0.32, 0.04), vec3(1.0, 0.82, 0.42), core) * uIntensity;
        if (uDirect > 0.5) {
          // 8-bit canvas, no tone mapping: soft-clip each layer so the three layers add up to a warm white core
          // instead of clipping to grey (or olive once the dark glass is over it)
          gl_FragColor = vec4((1.0 - exp(-col * f * f * 2.4)) * 0.42, 1.0);
        } else {
          gl_FragColor = vec4(col * f * 0.75, f);
          #include <colorspace_fragment>
        }
      }`,
  });
}

function buildFireplace() {
  const f = state.fireplace, face = state.finish.fireplaceSlats ? SLAT_FACE : 0;
  const g = new THREE.Group();
  g.name = 'fireplace'; g.userData.fixture = 'fireplace';
  const w = f.width, h = f.height, depth = WALL_T + 1;
  // firebox interior
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, depth),
    new THREE.MeshStandardMaterial({ color: '#0b0a09', roughness: 0.9, side: THREE.BackSide }));
  box.position.set(0, 0, -depth / 2 + face);
  g.add(box);
  // black metal surround
  const t = 1.6, fr = M.metal;
  for (const [sx, sy, px, py] of [[w + 2 * t, t, 0, h / 2 + t / 2], [w + 2 * t, t, 0, -h / 2 - t / 2], [t, h, -w / 2 - t / 2, 0], [t, h, w / 2 + t / 2, 0]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, 0.6), fr); m.position.set(px, py, face + 0.3); g.add(m);
  }
  // white stone ember bed
  const stones = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1),
    new THREE.MeshStandardMaterial({ color: '#e9e4dc', roughness: 0.8 }), 70);
  const r = rng(5), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < 70; i++) {
    const sx = 0.7 + r() * 0.9;
    e.set(r() * 3, r() * 3, r() * 3); q.setFromEuler(e);
    m4.compose(new THREE.Vector3((r() - 0.5) * (w - 4), -h / 2 + 2 + r() * 1.5, face - 2.5 - r() * 3),
      q, new THREE.Vector3(sx * 1.3, sx * 0.7, sx));
    stones.setMatrixAt(i, m4);
  }
  g.add(stones);
  const ember = new THREE.Mesh(new THREE.PlaneGeometry(w - 3, 5),
    new THREE.MeshBasicMaterial({ color: new THREE.Color('#ff6a1a').multiplyScalar(1.6), toneMapped: false, transparent: true, opacity: 0.9 }));
  ember.rotation.x = -Math.PI / 2; ember.position.set(0, -h / 2 + 1.6, face - 4);
  g.add(ember);
  const flames = [];
  for (const [i, z] of [[0, -5], [1, -3.5], [2, -2]]) {
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(w - 4, h * 0.72), flameMaterial(i * 7.3 + 1));
    fl.position.set(0, -h / 2 + 2 + h * 0.36, face + z); fl.renderOrder = 1;   // after the glass, so it never greys them
    flames.push(fl); g.add(fl);
  }
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.glassDark);
  glass.position.z = face + 0.05; g.add(glass);
  // flickering light into the lounge
  const light = new THREE.PointLight('#ff8a3d', 0, 0, 2);
  light.position.set(0, -h / 2 + 6, face + 10);
  g.add(light);
  // fireplace wall frame: u -> -Z, so rotate like the wall
  g.rotation.y = Math.PI / 2;
  g.position.copy(P(0, f.center, f.bottom + h / 2));
  fixturesGroup.add(g);
  FX.fire = { group: g, flames, ember, light };
}

function buildTransoms() {
  const { tr } = fireplaceOpenings();
  FX.transomGlow = [];
  if (state.finish.transoms === 'framed' && tr.length === 2) {
    // one 2″ black steel surround + a black mullion where the wall shows between the panes: one window, not two eyes
    const face = state.finish.fireplaceSlats ? SLAT_FACE : 0, b = 2;
    const u0 = Math.min(tr[0].u0, tr[1].u0), u1 = Math.max(tr[0].u1, tr[1].u1), v0 = tr[0].v0, v1 = tr[0].v1;
    const g = new THREE.Group(), W = u1 - u0, Hh = v1 - v0;
    for (const [sx, sy, px, py] of [[W + 2 * b, b, 0, Hh / 2 + b / 2], [W + 2 * b, b, 0, -Hh / 2 - b / 2], [b, Hh, -W / 2 - b / 2, 0], [b, Hh, W / 2 + b / 2, 0]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, 1.2), M.metal); m.position.set(px, py, face + 0.6); g.add(m);
    }
    const gapU0 = Math.min(tr[0].u1, tr[1].u1), gapU1 = Math.max(tr[0].u0, tr[1].u0);
    const mull = new THREE.Mesh(new THREE.BoxGeometry(gapU1 - gapU0, Hh, 0.8), M.metal);
    mull.position.set((gapU0 + gapU1) / 2 - (u0 + u1) / 2, 0, 0.4); g.add(mull);
    g.rotation.y = Math.PI / 2; g.position.copy(P(0, (u0 + u1) / 2, (v0 + v1) / 2));
    fixturesGroup.add(g);
  }
  const mode = state.finish.transoms, face = state.finish.fireplaceSlats ? SLAT_FACE : 0;

  const onWall = (obj, u, v) => { obj.rotation.y = Math.PI / 2; obj.position.copy(P(0, u, v)); fixturesGroup.add(obj); };

    meshAt(new THREE.BoxGeometry(W + 1, 2.2, 2.4), M.matteBlack, 0, Hh / 2 + 0.2, face + 1.4, g);

    const back = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: '#2b3846' }));

function buildStairs() {
  const r = state.room, G = geom(), g = new THREE.Group(); g.name = 'stairs';
  FX.stepLights = [];
  const y0 = -r.stairWidth, y1 = 0, wid = y1 - y0, yc = (y0 + y1) / 2;
  const slope = G.riserH / G.run, H = r.ceiling;
  const zAt = (x) => (x - r.stairStart) * slope;
  const xTop = Math.min(r.width, r.stairStart + H / slope);
  const openTo = Math.min(G.hallEnd, r.width);           // hallway side is open (railing) up to here
  const steps = [];
  // treads, risers and the mass under each step: three instanced draws instead of ~45 meshes
  const box = new THREE.BoxGeometry(1, 1, 1), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const treads = new THREE.InstancedMesh(box, M.stairWood, G.treads), risers = new THREE.InstancedMesh(box, M.stairWood, G.treads);
  const fills = new THREE.InstancedMesh(box, M.stairWood, G.treads);   // solid, dark: reads as a cut stringer from either side
  let n = 0;
  for (let i = 0; i < G.treads; i++) {
    const x0 = r.stairStart + i * G.run, top = (i + 1) * G.riserH;
    if (x0 >= r.width) break;
    const nose = i === 0 ? 2 : 1.2;                        // the starting step's bullnose is the tip of the stairs
    const len = Math.min(G.run + nose, r.width - x0 + nose);
    const extra = i === 0 ? 3 : 0;                         // wider starting step, like the one on site
    treads.setMatrixAt(n, m4.compose(P(x0 - nose + len / 2, yc, top - 0.62), q, sc.set(len, 1.25, wid + 1.2 + 2 * extra)));
    risers.setMatrixAt(n, m4.compose(P(x0 + 0.4, yc, top - G.riserH / 2 - 0.62), q, sc.set(0.75, G.riserH - 1.25, wid + 2 * extra)));
    const fh = Math.max(0.1, top - 1.3);
    fills.setMatrixAt(n, m4.compose(P(x0 + G.run / 2 + 0.75, yc, fh / 2), q, sc.set(G.run - 0.6, fh, wid - 0.2)));
    steps.push({ x0, top });
    if (top < H + 20) {                                    // low-glare light in each riser
      const lens = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 4), M.stepLight);
      lens.position.copy(P(x0 - 0.05, yc, top - G.riserH * 0.55)); g.add(lens); FX.stepLights.push(lens);
    }
    n++;
  }
  for (const im of [treads, risers, fills]) { im.count = n; g.add(im); }

  // knee walls under the stringers: room side (faces north) and hallway side (faces south)
  const knee = (x1, side) => {
    const pts = [[r.stairStart + 2, 0], [x1, 0], [x1, Math.min(H, zAt(x1) - 3)], [Math.min(x1, xTop), Math.min(H, zAt(Math.min(x1, xTop)) - 3)]];
    const geo = new THREE.ShapeGeometry(shapeFrom(side > 0 ? pts.map(([x, z]) => [-x, z]) : pts));
    const m = new THREE.Mesh(geo, M.wall);
    if (side > 0) { m.rotation.y = Math.PI; m.position.copy(P(0, 0.05, 0)); }   // mirrored + turned: faces north
    else m.position.copy(P(0, y0 - 0.05, 0));                                       // faces south, into the hallway
    g.add(m);
  };
  knee(r.width, 1);
  if (openTo > r.stairStart + 4) knee(openTo, -1);

  // dark stringers, iron balusters (one instanced draw), handrails and newels
  const iron = cached('stair-iron', () => new THREE.MeshStandardMaterial({ color: '#141312', roughness: 0.5, metalness: 0.6 }));
  const rail = 34, bal = [];
  const side = (yy, xEnd) => {
    const len = (xEnd - r.stairStart) / Math.cos(Math.atan(slope)), mid = (r.stairStart + xEnd) / 2;
    const stringer = new THREE.Mesh(new THREE.BoxGeometry(len, 9, 0.9), M.stairWood);
    stringer.rotation.z = Math.atan(slope); stringer.position.copy(P(mid, yy, zAt(mid) - 4)); g.add(stringer);
    const hr = new THREE.Mesh(new THREE.BoxGeometry(len, 2.6, 2.4), M.stairWood);
    hr.rotation.z = Math.atan(slope); hr.position.copy(P(mid, yy, zAt(mid) + G.riserH + rail + 1)); g.add(hr);
    for (const st of steps) for (const off of [G.run * 0.25, G.run * 0.75]) {
      const x = st.x0 + off; if (x > xEnd - 1) continue;
      const z0 = st.top, z1 = zAt(x) + G.riserH + rail;
      if (z0 < H + 30) bal.push([x, yy, z0, z1]);
    }
    const newel = new THREE.Mesh(new THREE.BoxGeometry(3.6, 40, 3.6), M.stairWood);
    newel.position.copy(P(r.stairStart - 1.5, yy, 20)); g.add(newel);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.2, 4.6), M.stairWood);
    cap.position.copy(P(r.stairStart - 1.5, yy, 40.6)); g.add(cap);
  };
  side(-1.8, xTop);                                        // room side
  if (openTo > r.stairStart + 4) side(y0 + 1.8, openTo);   // hallway side, open
  const balusters = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.32, 0.32, 1, 8), iron, bal.length);
  bal.forEach(([x, yy, z0, z1], i) => balusters.setMatrixAt(i, m4.compose(P(x, yy, (z0 + z1) / 2), q, sc.set(1, z1 - z0, 1))));
  g.add(balusters);
  fixturesGroup.add(g);
}

// ---------------- TV ----------------
function movieStill() {
  const cv = mkCanvas(1024, 576), g = cv.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 576);
  sky.addColorStop(0, '#1b2440'); sky.addColorStop(0.45, '#7a3f5c'); sky.addColorStop(0.7, '#f08a4b'); sky.addColorStop(1, '#2a1a1a');
  g.fillStyle = sky; g.fillRect(0, 0, 1024, 576);
  g.fillStyle = 'rgba(255,214,150,0.95)'; g.beginPath(); g.arc(640, 360, 46, 0, Math.PI * 2); g.fill();
  const r = rng(77);
  for (const [base, col] of [[400, '#3a1f2b'], [450, '#241521'], [500, '#140c12']]) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, 576);
    for (let x = 0; x <= 1024; x += 32) g.lineTo(x, base - Math.sin(x * 0.006 + r() * 2) * 40 - r() * 30);
    g.lineTo(1024, 576); g.fill();
  }
  g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 64); g.fillRect(0, 512, 1024, 64);   // 2.39:1 letterbox
  return canvasTex(cv, true);
}
let _still = null;

function buildFixtures() {
  disposeGroup(fixturesGroup);

  buildStairs(); buildFireplace(); buildTransoms(); buildTV(); buildMantel(); buildScreen();
  const { fp, tr } = fireplaceOpenings();
  if (state.finish.fireplaceSlats) {
    const top = r.beamDepth > 1 ? r.beamBottom : r.ceiling;
    const fireHole = { u0: fp.u0 - 1.6, u1: fp.u1 + 1.6, v0: fp.v0 - 1.6, v1: fp.v1 + 1.6 };
    const tmode = state.finish.transoms, uMin = Math.min(...tr.map((t) => t.u0)), uMax = Math.max(...tr.map((t) => t.u1));
    const pad = { framed: 2.5, shade: 1 }[tmode] ?? 0.5;
    // framed / shade: slats stop at the pair, not at each window; band: slats stop above and below one full-width strip
    const winHoles = tmode === 'band' ? [{ u0: 0, u1: G.mainY, v0: tr[0].v0 - 4, v1: tr[0].v1 + 4 }]
      : tmode === 'framed' || tmode === 'shade' ? [{ u0: uMin - pad, u1: uMax + pad, v0: tr[0].v0 - pad, v1: tr[0].v1 + pad }]

    if (state.finish.mantel === 'slab') { const sl = slabRect(); fireHole.u0 = sl.u0; fireHole.u1 = sl.u1; fireHole.v0 = sl.v0; fireHole.v1 = sl.v1; }
    // 'slatted' / 'hidden': slats run straight across the windows
    const across = (tmode === 'slatted' || tmode === 'hidden') && tr.length;

    const band = across && tmode === 'slatted' ? { u0: 10, u1: G.mainY - 10, v0: tr[0].v0 - 1, v1: tr[0].v1 + 1 } : null;
    const s = buildSlats(1.5, G.mainY - 1.5, 0.4, top - 0.2, across ? [fireHole] : [fireHole, ...winHoles], band ? [fireHole, band] : across ? [fireHole] : [fireHole, ...winHoles]);
    if (band) {

    s.position.copy(P(a[0], r.depth)); fixturesGroup.add(s);
  }
}

// ---------------- fireplace ledge / floating hearth bench ----------------
function buildMantel() {
  const kind = state.finish.mantel; if (!kind || kind === 'none') return;
  const { fp } = fireplaceOpenings(), G = geom(), face = state.finish.fireplaceSlats ? SLAT_FACE : 0;
  const wood = woodMat('#4a3020'), g = new THREE.Group(); g.name = 'mantel';
  if (kind === 'ledge') {
    // floating walnut shelf: splits the 'eyes' from the 'mouth'
    span(g, wood, fp.u0 - 14, fp.u1 + 14, fp.v1 + 6, fp.v1 + 8.5, face, face + 9, 0.4);
  } else if (kind === 'picture') {
    // full-width picture ledge between the fire and the windows: art leaned off-centre breaks the symmetry
    const r = state.room, v = fp.v1 + 6, c = (fp.u0 + fp.u1) / 2;
    const room = r.transomBottom - (state.finish.transoms === 'band' ? 5 : 2) - (v + 1.4);   // stay clear of the windows
    span(g, wood, 6, G.mainY - 6, v, v + 1.4, face, face + 5, 0.3);
    span(g, wood, 6, G.mainY - 6, v + 1.4, v + 2.6, face + 4.2, face + 5, 0.2);
    for (const [du, aw, k, col, dz] of [[-17, 24, 1, '#b4573a', 0], [1, 13, 0.7, '#d9cdb8', 0.9], [33, 14, 0.85, '#2f3a40', 0]]) {
      const u = c + du, ah = Math.max(6, room * k - 2);
      if (u - aw / 2 < 7 || u + aw / 2 > G.mainY - 7) continue;
      const fr = meshAt(new THREE.BoxGeometry(aw + 2, ah + 2, 0.8), M.matteBlack, u, v + 1.4 + (ah + 2) / 2, face + 2.2 + dz, g); fr.rotation.x = -0.1;
      meshAt(new THREE.PlaneGeometry(aw, ah), new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 }), 0, 0, 0.45, fr);
    }
    const vase = new THREE.LatheGeometry([[0, 0], [2.4, 0.2], [3.2, 4], [1.6, 9], [1.8, 10]].map(([x, y]) => new THREE.Vector2(x, y)), 24);
    meshAt(vase, new THREE.MeshStandardMaterial({ color: '#c9b79c', roughness: 0.8 }), c + 19, v + 1.4, face + 2.6, g);
  } else if (kind === 'slab') {
    // large porcelain slab from floor to just under the windows: the fireplace sits in one tall panel
    const sl = slabRect(), shape = shapeFrom(rect(sl.u0, sl.v0, sl.u1, sl.v1), [rect(fp.u0, fp.v0, fp.u1, fp.v1)]);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: face + 1.4, bevelEnabled: false });
    geo.computeBoundingBox();
    const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 60, uv.getY(i) / 60);
    g.add(new THREE.Mesh(geo, M.slab));
  } else if (kind === 'shelves') {
    // open walnut shelves either side of the fireplace, each with a book stack or a vase
    const sides = [[6, fp.u0 - 7], [fp.u1 + 7, G.mainY - 6]].filter(([a, b]) => b - a >= 14);
    const r = rng(81);
    for (const [a, b] of sides) for (const v of [30, 48, 66]) {
      span(g, wood, a, b, v, v + 1.6, face, face + 10, 0.3);
      if (r() < 0.55) for (let k = 0; k < 3; k++) {
        const bw = 1.4 + r(), bh = 7 + r() * 3;
        meshAt(new THREE.BoxGeometry(bw, bh, 7), new THREE.MeshStandardMaterial({ color: ['#6b5b4a', '#2f3a40', '#c9bba5', '#7a4a32'][k % 4], roughness: 0.9 }), a + 3 + k * (bw + 0.3), v + 1.6 + bh / 2, face + 4.5, g);
      } else {
        const vase = new THREE.LatheGeometry([[0, 0], [2, 0.2], [2.8, 3], [1.4, 7], [1.6, 8]].map(([x, y]) => new THREE.Vector2(x, y)), 20);
        meshAt(vase, new THREE.MeshStandardMaterial({ color: r() < 0.5 ? '#2a2622' : '#d8cdbb', roughness: 0.8 }), (a + b) / 2, v + 1.6, face + 5, g);
      }
    }
  } else {
    // full-width floating bench: extra perch seating, grounds the fireplace as one horizontal band
    span(g, wood, 6, G.mainY - 6, 13, 17, face, face + 17, 0.6);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(G.mainY - 16, 0.35, 0.35), M.led);
    strip.position.set(G.mainY / 2, 12.6, face + 13); g.add(strip); FX.fixtureLeds.push(strip);
  }
  g.rotation.y = Math.PI / 2;                          // wall frame: u -> plan y, +Z -> into the room
  fixturesGroup.add(g);
}

/** Stone slab extent in fireplace-wall coords: 15″ past the fireplace each side, floor (or bench) to just under the windows. */

const POT_CD = 11 * LUX;        // tuned to display exposure (a 650 lm wafer, scaled)
const LED_NITS = 2.2;

const FIRE_CD = 0.7 * LUX;
const LAMP_CD = 0.8 * LUX;
const LED_PT = 0.9 * LUX;      // fast mode: LED washes approximated by zone point lights
const TV_PT = 5 * LUX, SCREEN_PT = 4 * LUX;
const SCENES = {
  work:     { label: 'Bright',   pots: 1,    leds: 0.4, tv: false, fire: false, lamp: false, steps: false, screenDown: false },
  evening:  { label: 'Evening',  pots: 0.35, leds: 1,   tv: false, fire: true,  lamp: true,  steps: true,  screenDown: false },
  movie:    { label: 'Movie',    pots: 0,    leds: 0.18, tv: true, fire: false, lamp: false, steps: true,  screenDown: true },
  game:     { label: 'Game night', pots: 0.25, leds: 0.8, tv: true, fire: true,  lamp: true,  steps: true,  screenDown: false },
  fireside: { label: 'Fireside', pots: 0.08, leds: 0.7, tv: false, fire: true,  lamp: true,  steps: true,  screenDown: false },
};

function addPot(x, y, z, group) {
  // fast mode keeps the fixtures but lets a few zone lights do the lighting
  const light = isFast() ? null : new THREE.SpotLight('#ffd9b0', 0, 0, 52 * DEG, 0.75, 2);
  if (light) {
    light.position.copy(P(x, y, z - 0.6));
    light.target.position.copy(P(x, y, 0));
    group.add(light, light.target);
  }
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.9, 24), M.potOff);
  disc.rotation.x = Math.PI / 2; disc.position.copy(P(x, y, z - 0.08));
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.9, 2.6, 24), M.trim);
  ring.rotation.x = Math.PI / 2; ring.position.copy(P(x, y, z - 0.06));
  group.add(disc, ring);
  FX.pots.push({ light, disc });
}

/** Thin emissive strip from plan a -> b at height z, nudged by (ox, oy). */
function ledStrip(a, b, z, group, ox = 0, oy = 0) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.35, 0.35), M.led);
  m.rotation.y = Math.atan2(b[1] - a[1], b[0] - a[0]);
  m.position.copy(P((a[0] + b[0]) / 2 + ox, (a[1] + b[1]) / 2 + oy, z));
  group.add(m); FX.ledMeshes.push(m);
  return m;
}
function rectLight(w, h, pos, target, group, color = '#ffb36e') {
  if (isFast()) return null;                       // area lights are the most expensive thing to shade
  const l = new THREE.RectAreaLight(color, 0, w, h);
  l.position.copy(pos); group.add(l); l.lookAt(target);
  FX.leds.push(l);
  return l;
}

function buildLights() {
  disposeGroup(lightsGroup);
  FX.pots = []; FX.leds = []; FX.ledMeshes = []; FX.zones = [];
  const r = state.room, G = geom(), H = r.ceiling;
  lightsGroup.updateMatrixWorld(true);
  if (isFast()) {
    // one point light per zone stands in for that zone's pots (and its LED wash)
    const zone = (x, y, z, pots, led, color = '#ffd9b0') => {
      const l = new THREE.PointLight(color, 0, 0, 2); l.position.copy(P(x, y, z)); lightsGroup.add(l);
      FX.zones.push({ light: l, pots, led });
    };
    const bb = Math.min(r.beamBottom, H);
    zone(Math.max(r.beamDepth, 30) / 2, G.mainY / 2, bb - 10, 2, 1.1, '#ffd2a0');                            // fireplace lounge
    zone((Math.max(r.beamDepth, 0) + r.width) / 2, G.mainY / 2, H - 12, 6, 0.35);                               // main room
    zone(G.tvX, G.mainY + r.bayDepth * 0.45, r.soffitBottom - 8, state.light.bayPots ? 2 : 0, 0.9, '#ffcf9a');  // TV alcove
    zone((r.boxX + G.hallEnd) / 2, (G.hallY - r.stairWidth) / 2 + 12, H - 12, 2, 0.1);                         // landing + hallway
  }

  // bay: two pots in front of the bulkhead face, washing the TV wall
  // two pots in front of the bulkhead face: they scallop the bulkhead like a pair of eyes and glare on the screen
  const bayPotY = r.depth - r.soffitDepth - 7;
  if (state.light.bayPots) for (const dx of [-24, 24]) addPot(G.tvX + dx, bayPotY, H, lightsGroup);
  // main ceiling grid (clear of the fireplace bulkhead)
  const x0 = Math.max(r.beamDepth, 0) + 8, x1 = r.width - 22;
  for (const fx of [0, 0.5, 1]) for (const fy of [0.24, 0.74]) addPot(lerp(x0 + 14, x1, fx), G.mainY * fy, H, lightsGroup);
  // fireplace bulkhead underside, the landing below it, and the hallway behind the stairs
  if (r.beamDepth > 12) for (const dy of [-34, 34]) addPot(r.beamDepth / 2 + 4, state.fireplace.center + dy, r.beamBottom, lightsGroup);
  if (r.beamDepth > r.boxX + 6 && r.beamBottom < H) addPot((r.boxX + r.beamDepth) / 2, -r.stairWidth / 2, r.beamBottom, lightsGroup);
  if (G.hallEnd - r.boxX > 30) addPot(Math.min(G.hallEnd - 18, (r.beamDepth + G.hallEnd) / 2 + 10), (G.hallY - r.stairWidth) / 2, H, lightsGroup);

  // LED channel under the bay bulkhead, tight to the bay walls
  const z = r.soffitBottom - 0.3, bay = G.bay;
  for (let i = 0; i < bay.length - 1; i++) {
    const [a, b] = [bay[i], bay[i + 1]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]); if (len < 2) continue;
    const nx = (b[1] - a[1]) / len, ny = -(b[0] - a[0]) / len;   // walking L0..R0 the bay interior is on the right
    ledStrip(a, b, z, lightsGroup, nx * 1.2, ny * 1.2);
  }
  const fa = bay[2], fb = bay[3];
  rectLight(fb[0] - fa[0] - 4, 3, P((fa[0] + fb[0]) / 2, r.depth - 2, z - 0.4), P((fa[0] + fb[0]) / 2, r.depth - 6, 0), lightsGroup);
  for (const [a, b] of [[bay[1], bay[2]], [bay[3], bay[4]]]) {
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const l = rectLight(len - 4, 3, P(cx, cy, z - 0.4), P(cx, cy, 0), lightsGroup);
    if (l) l.lookAt(P(cx + (b[1] - a[1]) * 0.15, cy - (b[0] - a[0]) * 0.15, 0));
  }

  // vertical LED channels at both ends of the fireplace slat wall
  const top = r.beamDepth > 1 ? r.beamBottom : H;
  const face = state.finish.fireplaceSlats ? SLAT_FACE : 0;
  for (const [u, dir] of [[0.9, 1], [G.mainY - 0.9, -1]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, top - 1, 0.5), M.led);
    m.position.copy(P(face * 0.5 + 0.4, u, top / 2)); lightsGroup.add(m); FX.ledMeshes.push(m);
    rectLight(2, top - 4, P(face + 2.5, u, top / 2), P(face + 2.5, u + dir * 20, top / 2), lightsGroup);
  }
  // cove along the edge of the fireplace bulkhead
  if (r.beamDepth > 1 && r.beamBottom < H) {
    ledStrip([r.beamDepth - 1.2, 2], [r.beamDepth - 1.2, G.mainY - 2], r.beamBottom - 0.3, lightsGroup);
    rectLight(G.mainY - 8, 3, P(r.beamDepth - 2, G.mainY / 2, r.beamBottom - 0.6), P(r.beamDepth - 14, G.mainY / 2, 0), lightsGroup);
  }
  updateLighting();
}

/** Push state.light into every light, emissive and environment level. */
function updateLighting() {
  const L = state.light;
  // lights at zero are hidden, which also drops them from the shaders
  for (const { light, disc } of FX.pots) {
    if (light) { light.intensity = POT_CD * L.pots; light.visible = L.pots > 0.005; }
    disc.material = L.pots > 0.02 ? M.potOn : M.potOff;
  }
  for (const z of FX.zones || []) {
    z.light.intensity = POT_CD * 0.55 * z.pots * L.pots + LED_PT * z.led * L.leds;
    z.light.visible = z.light.intensity > 1;
  }
  M.potOn.color.set('#fff1dc').multiplyScalar(1 + 3 * L.pots);
  for (const l of FX.leds) { l.intensity = LED_NITS * L.leds; l.visible = L.leds > 0.005; }
  M.led.color.set('#ffb46b').multiplyScalar(0.15 + 2.6 * L.leds);
  M.bandGlow.color.set('#ffc890').multiplyScalar(0.25 + 1.3 * L.leds);
  for (const m of [...FX.ledMeshes, ...(FX.fixtureLeds || [])]) m.visible = L.leds > 0.01;
  M.stepLight.color.set(L.steps ? '#ffc58a' : '#3a342c').multiplyScalar(L.steps ? 2.2 : 1);
  const screenDown = !!(FX.screen && L.screenDown);
  if (FX.screen) {
    FX.screen.mat.emissive.set(screenDown && L.tv ? '#ffffff' : '#000000');
    FX.screen.mat.emissiveIntensity = screenDown && L.tv ? 0.95 : 0;
    FX.screen.glow.intensity = screenDown && L.tv ? (FX.screen.glow.isRectAreaLight ? 2.4 : SCREEN_PT) : 0;
    FX.screen.glow.visible = FX.screen.glow.intensity > 0;
  }
  if (FX.tv) {
    const tvOn = L.tv && !screenDown;                   // the projector takes over when the screen is down
    FX.tv.screenMat.emissive.set(tvOn ? '#ffffff' : '#000000');
    FX.tv.screenMat.emissiveIntensity = tvOn ? 1.15 : 0;
    FX.tv.glow.intensity = tvOn ? (FX.tv.glow.isRectAreaLight ? 3.5 : TV_PT) : 0;
    FX.tv.glow.visible = tvOn;
    if (FX.tv.bias) { FX.tv.bias.intensity = L.bias && L.tv ? 4 : L.bias ? 1.2 : 0; FX.tv.bias.visible = FX.tv.bias.intensity > 0; }
    FX.tv.halo.material.opacity = L.bias ? (L.tv && !screenDown ? 0.32 : L.tv ? 0 : 0.16) : 0;
  }
  if (FX.fire) {
    FX.fire.flames.forEach((f) => (f.visible = L.fire));
    FX.fire.ember.visible = L.fire;
    FX.fire.light.intensity = L.fire ? FIRE_CD : 0;
    FX.fire.light.visible = L.fire;
  }
  for (const b of FX.transomGlow) b.material.color.set(L.pots > 0.5 ? '#6f8396' : '#2b3846');
  M.reeded.emissiveIntensity = 0.1 + 0.3 * Math.max(L.pots, 0.3 * L.leds);
  const planBoost = typeof mode !== 'undefined' && mode === 'plan' ? 1.4 : 0;
  hemi.intensity = 0.06 + 0.5 * L.pots + 0.12 * L.leds + planBoost;
  const env = 0.015 + 0.08 * L.pots + 0.02 * L.leds + planBoost * 0.05;
  scene.traverse((o) => {
    if (!o.material) return;
    for (const m of [].concat(o.material)) if (m.isMeshStandardMaterial) m.envMapIntensity = env;
  });
  for (const it of state.items) if (it.type === 'floorLamp') setLamp(it.id, L.lamp);
  invalidate(3);
}

function applyScene(name) {
  const s = SCENES[name]; if (!s) return;
  Object.assign(state.light, { scene: name, pots: s.pots, leds: s.leds, tv: s.tv, fire: s.fire, lamp: s.lamp, steps: s.steps, screenDown: s.screenDown });
  updateLighting();
}

// ---- 40-furniture.js ----
// ===================================================================
// 40 · Furniture. Each factory builds in a local frame: origin = centre
// of the footprint on the floor, +Z = the side people face, inches.
// It returns { group, w, d, shadows: [[x, z, w, d]] }.
// ===================================================================
const rbox = (w, h, d, r = 1.5, seg = 3) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01));
function meshAt(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
/** Box spanning x0..x1, y0..y1, z0..z1 (rounded). */
function span(parent, mat, x0, x1, y0, y1, z0, z1, r = 1.5) {
  return meshAt(rbox(x1 - x0, y1 - y0, z1 - z0, r), mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, parent);
}

function makeSectional(p) {
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const B = p.back, R = p.ret, d = p.depth, arm = 6, bt = 8, base = 3.5, seatTop = 18.5, deck = 12;
  const fab = fabricMat(p.color, 'linen'), dark = M.black;
  const x0 = -B / 2, x1 = B / 2, z0 = -R / 2, z1 = R / 2;
  // recessed plinth
  span(inner, dark, x0 + 2, x1 - 2, 0, base, z0 + 2, z0 + d - 2, 0.3);
  span(inner, dark, x0 + 2, x0 + d - 2, 0, base, z0 + d - 2, z1 - 2, 0.3);
  // backrests, arms, decks
  span(inner, fab, x0, x1 - arm, base, 30, z0, z0 + bt, 2.5);
  span(inner, fab, x0, x0 + bt, base, 30, z0 + bt, z1 - arm, 2.5);
  span(inner, fab, x1 - arm, x1, base, 24, z0, z0 + d, 2.5);
  span(inner, fab, x0, x0 + d, base, 24, z1 - arm, z1, 2.5);
  span(inner, fab, x0 + bt, x1 - arm, base, deck, z0 + bt, z0 + d, 1.5);
  span(inner, fab, x0 + bt, x0 + d, base, deck, z0 + d, z1 - arm, 1.5);
  // seat cushions: corner + back leg + return
  const gap = 0.4;
  span(inner, fab, x0 + bt + gap, x0 + d, deck, seatTop, z0 + bt + gap, z0 + d, 2.6);
  const runB = x1 - arm - (x0 + d), nB = Math.max(1, Math.round(runB / 30));
  for (let i = 0; i < nB; i++) {
    const a = x0 + d + (runB * i) / nB + gap, b = x0 + d + (runB * (i + 1)) / nB - gap;
    span(inner, fab, a, b, deck, seatTop, z0 + bt + gap, z0 + d, 2.6);
  }
  const runR = z1 - arm - (z0 + d), nR = Math.max(1, Math.round(runR / 30));
  for (let i = 0; i < nR; i++) {
    const a = z0 + d + (runR * i) / nR + gap, b = z0 + d + (runR * (i + 1)) / nR - gap;
    span(inner, fab, x0 + bt + gap, x0 + d, deck, seatTop, a, b, 2.6);
  }
  // loose back cushions, slightly reclined
  const backC = (cx, cz, w, rotY) => {
    const m = meshAt(rbox(w, 17, 6.5, 3), fab, cx, seatTop + 8, cz, inner);
    m.rotation.y = rotY; m.rotateX(-0.16);
  };
  for (let i = 0; i < nB; i++) {
    const a = x0 + d + (runB * i) / nB, b = x0 + d + (runB * (i + 1)) / nB;
    backC((a + b) / 2, z0 + bt + 3, b - a - 1, 0);
  }
  backC(x0 + bt + (d - bt) / 2 + 2, z0 + bt + 3, d - bt - 3, 0);
  for (let i = 0; i < nR; i++) {
    const a = z0 + d + (runR * i) / nR, b = z0 + d + (runR * (i + 1)) / nR;
    backC(x0 + bt + 3, (a + b) / 2, b - a - 1, Math.PI / 2);
  }
  // accent pillows
  const pil = fabricMat('#d8cdbb', 'boucle');
  for (const [x, z, ry] of [[x0 + bt + 9, z0 + bt + 9, Math.PI / 4], [x1 - arm - 10, z0 + bt + 7, -0.15]]) {
    const m = meshAt(rbox(18, 17, 5, 2.5), pil, x, seatTop + 8, z, inner); m.rotation.y = ry; m.rotateX(-0.25);
  }
  if (p.side === 'left') inner.scale.x = -1;
  const s = p.side === 'left' ? -1 : 1;
  return { group: g, w: B, d: R, shadows: [[0, z0 + d / 2, B, d], [s * (x0 + d / 2), (z0 + d + z1) / 2, d, R - d]] };
}

function makeSofa(p) {
  const g = new THREE.Group(), W = p.w, d = p.depth, arm = 6, bt = 8, fab = fabricMat(p.color, 'linen');
  const x0 = -W / 2, x1 = W / 2, z0 = -d / 2, z1 = d / 2;
  span(g, M.black, x0 + 2, x1 - 2, 0, 3.5, z0 + 2, z1 - 2, 0.3);
  span(g, fab, x0, x1, 3.5, 30, z0, z0 + bt, 2.5);
  span(g, fab, x0, x0 + arm, 3.5, 24, z0, z1, 2.5);
  span(g, fab, x1 - arm, x1, 3.5, 24, z0, z1, 2.5);
  span(g, fab, x0 + arm, x1 - arm, 3.5, 12, z0 + bt, z1, 1.5);
  const n = Math.max(1, Math.round((W - 2 * arm) / 30)), run = W - 2 * arm;
  for (let i = 0; i < n; i++) {
    const a = x0 + arm + (run * i) / n + 0.4, b = x0 + arm + (run * (i + 1)) / n - 0.4;
    span(g, fab, a, b, 12, 18.5, z0 + bt + 0.4, z1, 2.6);
    const m = meshAt(rbox(b - a - 0.6, 17, 6.5, 3), fab, (a + b) / 2, 26.5, z0 + bt + 3, g); m.rotateX(-0.16);
  }
  return { group: g, w: W, d, shadows: [[0, 0, W, d]] };
}

function makeLoungeChair(p) {
  const g = new THREE.Group(), fab = fabricMat(p.color, 'boucle');
  const shape = new THREE.Shape();
  const a0 = -18 * DEG, a1 = 198 * DEG, ro = [15, 15.5], ri = [10.2, 10.6], cy = 0.5, N = 40;
  for (let i = 0; i <= N; i++) { const t = lerp(a0, a1, i / N); const x = Math.cos(t) * ro[0], y = cy + Math.sin(t) * ro[1]; i ? shape.lineTo(x, y) : shape.moveTo(x, y); }
  for (let i = N; i >= 0; i--) { const t = lerp(a0, a1, i / N); shape.lineTo(Math.cos(t) * ri[0], cy + Math.sin(t) * ri[1]); }
  const shell = new THREE.ExtrudeGeometry(shape, { depth: 23, bevelEnabled: true, bevelThickness: 2.4, bevelSize: 2.2, bevelSegments: 4, curveSegments: 24 });
  shell.rotateX(-Math.PI / 2); shell.translate(0, 2.4, 0);
  meshAt(shell, fab, 0, 0, 0, g);
  meshAt(rbox(24, 13, 25, 4), fab, 0, 6.5, 2.5, g);                     // seat block
  meshAt(rbox(22.5, 5.5, 22, 2.6), fab, 0, 15.2, 3.4, g);                // cushion
  const pillow = meshAt(rbox(16, 13, 4.5, 2.2), fabricMat('#8a7764', 'linen'), 0, 23, -6.5, g); pillow.rotateX(-0.3);
  return { group: g, w: 31, d: 32, shadows: [[0, 0, 32, 32]] };
}

function makeRoundTable(p) {
  const g = new THREE.Group(), r = p.dia / 2, wood = woodMat(p.color);
  const prof = [[r * 0.5, 0], [r * 0.48, 1.2], [r * 0.3, 4], [r * 0.22, 8], [r * 0.26, 11.5], [r * 0.42, 14.2], [r * 0.45, 14.6], [0, 14.6]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  meshAt(new THREE.LatheGeometry(prof, 48), wood, 0, 0, 0, g);
  meshAt(new THREE.CylinderGeometry(r, r - 0.4, 1.8, 64), wood, 0, 15.5, 0, g);
  // styling: stacked books, bowl, small vase with greenery

// ---------------- walk mode ----------------
const walk = { yaw: 0, pitch: 0, keys: new Set(), pos: new THREE.Vector3(), dragging: false, pad: 0 };
function enterWalk() {
  const G = geom(), r = state.room;
  const start = P((r.boxX + r.stairStart) / 2, -r.stairWidth / 2, 64);      // foot of the stairs
  walk.pos.copy(start);
  const look = P(G.tvX, state.room.depth, 48).sub(start);
  walk.yaw = Math.atan2(-look.x, -look.z); walk.pitch = -0.08;
}

  const o = geom().outline; let inside = false;

  }

}
function stepWalk(dt) {

  let f = 0, s = 0;
  if (k.has('KeyW') || k.has('ArrowUp')) f += 1;
  if (k.has('KeyS') || k.has('ArrowDown')) f -= 1;
  if (k.has('KeyA') || k.has('ArrowLeft')) s -= 1;
  if (k.has('KeyD') || k.has('ArrowRight')) s += 1;
  f += walk.pad;

    const rt = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
    const next = walk.pos.clone().addScaledVector(fw, f * speed).addScaledVector(rt, s * speed);

    if (insideRoom(next.x + m, -walk.pos.z) && insideRoom(next.x - m, -walk.pos.z)) walk.pos.x = next.x;
    if (insideRoom(walk.pos.x, -next.z + m) && insideRoom(walk.pos.x, -next.z - m)) walk.pos.z = next.z;
  }

  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}

/**
 * 5.1.2 pre-wire plan from the prime seat, after Dolby's placement angles:

window.addEventListener('keydown', (e) => {
  const t = e.target || {}, tag = t.tagName || '';

  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
